server.port=8081
spring.application.name=bookmycourt

spring.datasource.url=jdbc:postgresql://localhost:5432/bookmycourt
spring.datasource.username=postgres
spring.datasource.password=BookMyCourt@123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

bookmycourt.booking.open-slot=12
bookmycourt.booking.close-slot=44
bookmycourt.booking.daily-cap=2
bookmycourt.booking.hold-minutes=5
bookmycourt.booking.reaper-ms=15000

management.endpoints.web.exposure.include=health,info
