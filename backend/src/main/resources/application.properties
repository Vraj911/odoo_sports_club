server.port=8081
spring.application.name=bookmycourt

spring.datasource.url=jdbc:postgresql://localhost:5432/bookmycourt
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:BookMyCourt@123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

spring.threads.virtual.enabled=true
spring.task.scheduling.pool.size=4
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

# mail (section 3.10)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# club behaviour
club.mail.from=Champions Club <no-reply@bookmycourt.local>
club.mail.reply-to=frontdesk@bookmycourt.local
club.public-url=${APP_PUBLIC_URL:http://localhost:5173}
booking.default-daily-cap=2
booking.hold-reaper-ms=30000
payments.simulated-online=true
payments.pay-at-club-enabled=true
payments.max-open-dues-per-member=2
payments.manager-approval-above=2000.00
payments.reconciliation-threshold=100.00
notifications.dispatch-ms=5000
notifications.max-attempts=5
uploads.dir=${FILE_STORAGE_DIR:./data/uploads}
spring.servlet.multipart.max-file-size=5MB
share-link.secret=${SHARE_LINK_SECRET:change-me-in-env}

bookmycourt.booking.open-slot=12
bookmycourt.booking.close-slot=44
bookmycourt.booking.daily-cap=2
bookmycourt.booking.hold-minutes=5
bookmycourt.booking.reaper-ms=15000
